name: Release WebRTC NetEQ GStreamer plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.deb_arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            runner: ubuntu-24.04
          - deb_arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install host packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            dpkg-dev \
            file \
            git \
            gstreamer1.0-tools \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev \
            lsb-release \
            pkg-config \
            python3 \
            sudo \
            xz-utils

      - name: Clone source and sync WebRTC deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eux
          mkdir -p /work
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /work/depot_tools
          export PATH="/work/depot_tools:${PATH}"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone --depth=1 --branch "${REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" /work/src
          src_revision="$(git -C /work/src rev-parse HEAD)"
          cd /work
          cat > .gclient <<EOF
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/${GITHUB_REPOSITORY}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
            },
          ]
          EOF
          gclient sync --no-history --shallow --revision "src@${src_revision}"

      - name: Install WebRTC build dependencies
        working-directory: /work/src
        run: ./build/install-build-deps.sh --no-prompt --no-chromeos-fonts --no-arm --no-nacl

      - name: Build plugin
        working-directory: /work/src
        run: |
          export PATH="/work/depot_tools:${PATH}"
          gn gen out/webrtcneteq-release --args='is_debug=false rtc_include_tests=false treat_warnings_as_errors=false use_sysroot=false'
          autoninja -C out/webrtcneteq-release :gst_webrtcneteq

      - name: Smoke test plugin load
        working-directory: /work/src
        run: GST_PLUGIN_PATH="$PWD/out/webrtcneteq-release" gst-inspect-1.0 webrtcneteq

      - name: Package plugin
        working-directory: /work/src
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: bash gst/webrtcneteq/packaging/package-linux.sh "${GITHUB_REF_NAME}" "${GITHUB_WORKSPACE}/dist/linux-${{ matrix.deb_arch }}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.deb_arch }}
          path: dist/linux-${{ matrix.deb_arch }}/*

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - name: Install host packages
        run: brew install pkg-config gstreamer gst-plugins-base

      - name: Clone source and sync WebRTC deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eux
          work_dir="${RUNNER_TEMP}/webrtcneteq-release"
          mkdir -p "${work_dir}"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${work_dir}/depot_tools"
          export PATH="${work_dir}/depot_tools:${PATH}"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone --depth=1 --branch "${REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" "${work_dir}/src"
          src_revision="$(git -C "${work_dir}/src" rev-parse HEAD)"
          cd "${work_dir}"
          cat > .gclient <<EOF
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/${GITHUB_REPOSITORY}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
            },
          ]
          EOF
          gclient sync --no-history --shallow --revision "src@${src_revision}"

      - name: Build plugin
        working-directory: ${{ runner.temp }}/webrtcneteq-release/src
        run: |
          export PATH="${RUNNER_TEMP}/webrtcneteq-release/depot_tools:${PATH}"
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          gn gen out/webrtcneteq-release --args='is_debug=false rtc_include_tests=false treat_warnings_as_errors=false'
          autoninja -C out/webrtcneteq-release :gst_webrtcneteq

      - name: Smoke test plugin load
        working-directory: ${{ runner.temp }}/webrtcneteq-release/src
        run: GST_PLUGIN_PATH="$PWD/out/webrtcneteq-release" gst-inspect-1.0 webrtcneteq

      - name: Package plugin
        working-directory: ${{ runner.temp }}/webrtcneteq-release/src
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: bash gst/webrtcneteq/packaging/package-macos.sh "${GITHUB_REF_NAME}" "${GITHUB_WORKSPACE}/dist/macos"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/macos/*

  release:
    name: Publish GitHub release
    needs:
      - linux
      - macos
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eux
          find dist -type f -print | sort
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" $(find dist -type f | sort) --clobber
          else
            gh release create "${TAG}" $(find dist -type f | sort) --title "${TAG}" --generate-notes
          fi
