name: Release WebRTC NetEQ GStreamer plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.deb_arch }}
    runs-on: ubuntu-24.04
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            target_cpu: x64
            strip: strip
            smoke_test: true
          - deb_arch: arm64
            target_cpu: arm64
            strip: aarch64-linux-gnu-strip
            smoke_test: false
    steps:
      - name: Install host packages
        run: |
          if [ "${{ matrix.deb_arch }}" = "arm64" ]; then
            dpkg --add-architecture arm64
          fi
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            dpkg-dev \
            file \
            git \
            gstreamer1.0-tools \
            lsb-release \
            pkg-config \
            python3 \
            sudo \
            xz-utils
          if [ "${{ matrix.deb_arch }}" = "arm64" ]; then
            apt-get install -y --no-install-recommends \
              binutils-aarch64-linux-gnu \
              g++-aarch64-linux-gnu \
              gcc-aarch64-linux-gnu \
              libgstreamer-plugins-base1.0-dev:arm64 \
              libgstreamer1.0-dev:arm64
          else
            apt-get install -y --no-install-recommends \
              libgstreamer-plugins-base1.0-dev \
              libgstreamer1.0-dev
          fi

      - name: Clone source and sync WebRTC deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eux
          mkdir -p /work
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git /work/depot_tools
          export PATH="/work/depot_tools:${PATH}"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone --depth=1 --branch "${REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" /work/src
          src_revision="$(git -C /work/src rev-parse HEAD)"
          cd /work
          cat > .gclient <<EOF
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/${GITHUB_REPOSITORY}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
            },
          ]
          EOF
          gclient sync --no-history --shallow --revision "src@${src_revision}"

      - name: Install WebRTC build dependencies
        working-directory: /work/src
        run: ./build/install-build-deps.sh --no-prompt --no-chromeos-fonts --no-arm --no-nacl

      - name: Build plugin
        working-directory: /work/src
        run: |
          set -eux
          export PATH="/work/depot_tools:${PATH}"
          gn_args='is_debug=false rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false treat_warnings_as_errors=false use_sysroot=false use_siso=false'
          if [ "${{ matrix.deb_arch }}" = "arm64" ]; then
            cat > /tmp/aarch64-linux-gnu-pkg-config <<'EOF'
          #!/bin/sh
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          unset PKG_CONFIG_PATH
          exec pkg-config "$@"
          EOF
            chmod +x /tmp/aarch64-linux-gnu-pkg-config
            gn_args="${gn_args} target_cpu=\"${{ matrix.target_cpu }}\" pkg_config=\"/tmp/aarch64-linux-gnu-pkg-config\""
          fi
          gn gen out/webrtcneteq-release --args="${gn_args}"
          ninja -C out/webrtcneteq-release :gst_webrtcneteq

      - name: Smoke test plugin load
        if: matrix.smoke_test
        working-directory: /work/src
        run: GST_PLUGIN_PATH="$PWD/out/webrtcneteq-release" gst-inspect-1.0 webrtcneteq

      - name: Inspect cross-built plugin
        if: ${{ !matrix.smoke_test }}
        working-directory: /work/src
        run: |
          file out/webrtcneteq-release/libgstwebrtcneteq.so
          aarch64-linux-gnu-readelf -h out/webrtcneteq-release/libgstwebrtcneteq.so

      - name: Package plugin
        working-directory: /work/src
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          STRIP: ${{ matrix.strip }}
        run: bash gst/webrtcneteq/packaging/package-linux.sh "${GITHUB_REF_NAME}" "${GITHUB_WORKSPACE}/dist/linux-${{ matrix.deb_arch }}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.deb_arch }}
          path: dist/linux-${{ matrix.deb_arch }}/*

  macos:
    name: macOS
    runs-on: macos-14
    env:
      GSTREAMER_ROOT: /Library/Frameworks/GStreamer.framework/Versions/1.0
      GSTREAMER_VERSION: 1.20.7
    steps:
      - name: Install pinned GStreamer SDK
        run: |
          set -eux
          curl -fL \
            "https://gstreamer.freedesktop.org/data/pkg/osx/${GSTREAMER_VERSION}/gstreamer-1.0-${GSTREAMER_VERSION}-universal.pkg" \
            -o "${RUNNER_TEMP}/gstreamer-runtime.pkg"
          curl -fL \
            "https://gstreamer.freedesktop.org/data/pkg/osx/${GSTREAMER_VERSION}/gstreamer-1.0-devel-${GSTREAMER_VERSION}-universal.pkg" \
            -o "${RUNNER_TEMP}/gstreamer-devel.pkg"
          sudo installer -pkg "${RUNNER_TEMP}/gstreamer-runtime.pkg" -target /
          sudo installer -pkg "${RUNNER_TEMP}/gstreamer-devel.pkg" -target /
          export PKG_CONFIG_PATH="${GSTREAMER_ROOT}/lib/pkgconfig"
          "${GSTREAMER_ROOT}/bin/pkg-config" --modversion gstreamer-1.0
          "${GSTREAMER_ROOT}/bin/gst-inspect-1.0" --version

      - name: Clone source and sync WebRTC deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eux
          work_dir="${RUNNER_TEMP}/webrtcneteq-release"
          mkdir -p "${work_dir}"
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${work_dir}/depot_tools"
          export PATH="${work_dir}/depot_tools:${PATH}"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone --depth=1 --branch "${REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" "${work_dir}/src"
          src_revision="$(git -C "${work_dir}/src" rev-parse HEAD)"
          cd "${work_dir}"
          cat > .gclient <<EOF
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/${GITHUB_REPOSITORY}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
            },
          ]
          EOF
          gclient sync --no-history --shallow --revision "src@${src_revision}"

      - name: Build plugin
        working-directory: ${{ runner.temp }}/webrtcneteq-release/src
        run: |
          export PATH="${GSTREAMER_ROOT}/bin:${RUNNER_TEMP}/webrtcneteq-release/depot_tools:${PATH}"
          export PKG_CONFIG_PATH="${GSTREAMER_ROOT}/lib/pkgconfig"
          export DYLD_LIBRARY_PATH="${GSTREAMER_ROOT}/lib:${DYLD_LIBRARY_PATH:-}"
          export DYLD_FRAMEWORK_PATH="/Library/Frameworks:${DYLD_FRAMEWORK_PATH:-}"
          gn gen out/webrtcneteq-release --args='is_debug=false rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false treat_warnings_as_errors=false use_siso=false use_clang_modules=false gst_webrtcneteq_mac_deployment_target="12.0"'
          ninja -C out/webrtcneteq-release :gst_webrtcneteq

      - name: Smoke test plugin load
        working-directory: ${{ runner.temp }}/webrtcneteq-release/src
        run: |
          export PATH="${GSTREAMER_ROOT}/bin:${PATH}"
          export DYLD_LIBRARY_PATH="${GSTREAMER_ROOT}/lib:${DYLD_LIBRARY_PATH:-}"
          export DYLD_FRAMEWORK_PATH="/Library/Frameworks:${DYLD_FRAMEWORK_PATH:-}"
          GST_PLUGIN_PATH="$PWD/out/webrtcneteq-release" gst-inspect-1.0 webrtcneteq

      - name: Package plugin
        working-directory: ${{ runner.temp }}/webrtcneteq-release/src
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: bash gst/webrtcneteq/packaging/package-macos.sh "${GITHUB_REF_NAME}" "${GITHUB_WORKSPACE}/dist/macos"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/macos/*

  release:
    name: Publish GitHub release
    needs:
      - linux
      - macos
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eux
          find dist -type f -print | sort
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" $(find dist -type f | sort) --clobber
          else
            gh release create "${TAG}" $(find dist -type f | sort) --title "${TAG}" --generate-notes
          fi
